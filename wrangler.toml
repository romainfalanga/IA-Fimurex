name = "iafimurex"
main = "src/worker.ts"
compatibility_date = "2026-04-14"
compatibility_flags = ["nodejs_compat"]
account_id = "834ee251038ce2f923cba9847f973c40"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
